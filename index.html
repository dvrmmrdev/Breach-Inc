<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breach Inc.</title>
  <meta name="description" content="A text-based game for leaders: live through a major data breach, written by someone who&#39;s been there.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Breach Inc.">
  <meta property="og:url" content="https://breach-inc.com/">
  <meta property="og:title" content="Breach Inc.">
  <meta property="og:description" content="A text-based game for leaders: live through a major data breach, written by someone who&#39;s been there.">
  <meta property="og:image" content="https://breach-inc.com/art/preview.png">
  <meta property="og:image:width" content="1200">

  <link rel="icon" type="image/svg+xml" href="art/favicon-03-lit-door.svg?v=3">

<body>
  <div class="container">
    <header class="top">
      <div class="brand">ACME Inc. &middot; Incident Simulation</div>
      <button type="button" id="restart" class="link-btn">Restart</button>
    </header>
    <div id="hud" class="hud" aria-label="Status"></div>
    <main id="main" class="card" tabindex="-1" aria-live="polite"></main>
    <section aria-label="Decision log">
      <div class="stat-label log-heading">Decision log</div>
      <div id="log" class="log-panel"></div>
    </section>
    <footer class="disclaimer">
      Loosely inspired by real events which happened to the game's creator. All companies, people, projects and details are fictional or anonymised.
      <br>Feedback on the game is very welcome: <a href="mailto:dave.rimmer@gmail.com?subject=Breach%20Inc.%20feedback">email me</a>.
    </footer>
  </div>
</body>
</html>
